<!DOCTYPE html>
<html th:lang="${languageCode}">
<head>
    <meta th:replace="fragments/head">
    <link rel="stylesheet" th:href="|${basePath}/resources/styles/all-screens.css|">
    <div th:replace="fragments/workspace-all-screens :: workspace-all-screens-head"></div>
</head>

<body class="view--column all-screens" th:classappend="${flags.auditMode} ? 'audit-mode'">
<a class="usa-skipnav" href="#main-content">Skip to main content</a>
<div class="app-container">
    <!--/* Browse All and Path Mode are workspace surfaces, not the product: they list every screen of
           the flow side by side rather than presenting one. The government banner and the IRS
           logo-banner are the *product's* chrome — showing them here dresses a developer tool as the
           real thing, so they are rendered only by page.html.

           The two bars are direct children of the scrolling container, not wrapped in a <header>:
           each pins itself to the top of the scroll and a sticky box cannot leave its parent's box,
           so a wrapper sized to the nav would have given the nav nowhere to stick. See the same
           arrangement, and the same reasoning, in page.html. */-->
    <div th:replace="fragments/taxpert-global-nav"></div>
    <taxpert-screens-toolbar id="screens-toolbar"></taxpert-screens-toolbar>

    <!--/* The product's visible language switcher is part of the chrome this page deliberately does
           not render (above). Language is still a choice here — it is one of the Display options,
           which the global nav offers on both listing destinations — and the Display modal builds
           that control by mirroring this one, so that the routes stay the server's rather than
           becoming a second locale list inside the workspace. Hence a real, complete <select> that
           is never shown: it is the data the modal reads, in the markup that already knows how to
           write it.

           Its routes name the page and not the destination, because the server cannot see a query
           string and one generated page is both Browse All and Path Mode; <taxpert-screens-toolbar>
           adds `?mode=` back on the page that needs it. */-->
    <div class="all-screens__language-source" hidden>
        <label for="language-selector">Select Language</label>
        <select class="usa-select" id="language-selector" name="language-selector">
            <option value="" disabled selected>Select Language</option>
            <option th:each="lang : ${supportedLocales}"
                    th:value="${lang.key == app.defaultLocale} ? |${basePath}${currentPageRoute}| : |${basePath}/${lang.key}${currentPageRoute}|"
                    th:text="${lang.value}">
            </option>
        </select>
    </div>

    <div class="usa-in-page-nav-container">
        <main id="main-content" class="main-content usa-prose">
            <section th:each="section : ${sections}"
                     class="all-screens__section"
                     th:data-section="${section.slug}">
                <header class="all-screens__section-header">
                    <h2 th:id="${section.slug}" th:text="${section.title}">Section</h2>
                    <span class="all-screens__section-meta">
                        <span th:text="#{all-screens.section.page-count(${section.pageCount})}">N pages</span>
                        <span class="all-screens__section-meta-sep" aria-hidden="true">·</span>
                        <span th:text="#{all-screens.section.condition-count(${section.conditionCount})}">N conditions</span>
                    </span>
                </header>

                <article th:each="page : ${section.pages}"
                         class="screen"
                         th:data-route="${page.route}"
                         th:data-condition-count="${page.conditionCount}"
                         th:attr="data-gate-condition=${page.gateConditionPath}, data-gate-operator=${page.gateConditionOperator}">
                    <header class="screen__header">
                        <h3 class="screen__title" th:text="${page.title}">Page Title</h3>
                        <span class="screen__meta">
                            <code class="screen__route" th:text="${page.route}">/route</code>
                            <span class="screen__meta-sep" aria-hidden="true">·</span>
                            <span class="screen__condition-count"
                                  th:text="#{all-screens.screen.condition-count(${page.conditionCount})}">N conditions</span>
                        </span>
                    </header>
                    <div class="screen__content" th:utext="${page.content}">Lorem Ipsum</div>
                </article>
            </section>
        </main>
    </div>

    <template th:replace="fragments/js-templates"></template>
</div>

<div th:replace="fragments/audit-panel"></div>
<div th:replace="fragments/tool-dock"></div>
<th:block th:if="${flags.auditMode}">
    <div th:replace="fragments/workspace-enable :: workspace-enable"></div>
</th:block>
<div th:replace="fragments/workspace-all-screens :: workspace-all-screens-body"></div>
<script type="module" th:src="|${basePath}/resources/js/all-screens-bootstrap.js|"></script>
</body>
</html>
