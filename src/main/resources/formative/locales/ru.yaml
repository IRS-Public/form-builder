# Chrome for the templates gov.irs::formative ships — the wording on a
# collection's add/remove buttons, a date field's months, the validation messages, the
# USWDS banner and identifier. Identical in every Formative app, so it lives with the
# templates that ask for it rather than being copied into each app's locales.
#
# An app overrides any key here just by declaring it: lookup is app first, then this
# file, then the generated flow locale.
components:
  fg-set:
    required: (Обязательно)
  fg-collection:
