<!--/* What the flow runtime needs to know about this application, read by runtime-config.js.
       Ungated on purpose: the runtime is what a generated questionnaire *runs on*, whether or not the
       site was built with --auditMode. These values used to arrive only through the workspace's own
       fragments/taxpert-config.html, which sits inside the --auditMode block below — so a site built
       without the workspace silently ran on a shared default storage prefix, and two such apps served
       from one origin rehydrated each other's fact graph out of sessionStorage.

       <meta> rather than an inline module that calls configureRuntime(): fg-fact-graph.js reads the
       stored graph at its top level, so a configuring script would have to execute before it. Document
       order does guarantee that, but silently — put the block in the wrong place and the page still
       renders, just against the wrong key. Meta tags are parsed before any module runs, so there is
       no order to get wrong. The names are listed in runtime-config.js's META_KEYS.

       basePath is sent even though runtime-paths.js can derive it from its own import.meta.url,
       because that derivation fails *silently* when it fails: basePath becomes '' and every link
       quietly turns root-relative. The server knows the real answer for nothing. Sending it also
       hardens everything built on top of it — resourceUrl() falls back through appBasePath(), so the
       fact dictionary and the fact-graph engine resolve correctly even if the self-location breaks.
       Their full URLs are deliberately *not* sent: that would put the vendored engine's version
       number in a second place to bump. */-->
<meta name="formative:storage-prefix" th:content="${app.storageKeyPrefix}" />
<meta name="formative:base-path" th:content="${basePath}" />

<script type="module" th:src="|${basePath}/resources/js/fg-components.js|"></script>
<script type="module" th:src="|${basePath}/resources/vendor/formative/flow-runtime/js/modals.js|"></script>

<!--
  The workspace slot, filled only in an --auditMode build.

  Two application-owned fragments, and the scaffold names nothing inside either of them: what mounts
  a workspace is `taxpert`'s business and an app's, not this library's. See
  fragments/workspace-head.html for why that seam exists rather than the paths being spelled out
  here, and fragments/taxpert-config.html for the configuration half.

  `flags` is set on the page context but not on the all-screens one, so `flags != null` is exactly
  "this is a product page" — the only place the workspace mounts. all-screens is generated with the
  workspace's stylesheet disabled and has no .app-container for its flex layout, so loading these
  modules there would buy nothing and inject unstyled chips into the one page that already draws
  its own.
-->
<th:block th:if="${flags != null and flags.auditMode}">
  <div th:replace="fragments/workspace-head :: workspace-head"></div>
  <div th:replace="fragments/taxpert-config :: taxpert-config"></div>
</th:block>

<script th:src="|${basePath}/resources/vendor/uswds-3.13.0/js/uswds-init.min.js|"></script>
<script defer th:src="|${basePath}/resources/vendor/uswds-3.13.0/js/uswds.min.js|"></script>

<!--/* Anything else this application wants in <head>: a vendored library, an extra module, a font.
       The library ships an empty default; an app drops its own fragments/app-head.html beside its
       other templates and it wins by app-first resolution.

       A parser-level comment: this is a note to whoever edits the template, and has no business
       being served on all 40-odd pages of every generated site. */-->
<div th:replace="fragments/app-head :: app-head"></div>
