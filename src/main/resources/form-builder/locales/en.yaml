# Chrome for the templates gov.irs::form-builder ships — the wording on a
# collection's add/remove buttons, a date field's months, the validation messages, the
# USWDS banner and identifier. Identical in every Form Builder app, so it lives with the
# templates that ask for it rather than being copied into each app's locales.
#
# An app overrides any key here just by declaring it: lookup is app first, then this
# file, then the generated flow locale.
components:
  fg-set:
    required: (Required)
  fg-collection:
    buttons:
      remove: Remove {0}
      add: Add {0}
      add-with-determiner: Add {1} {0}
    remove-item-modal:
      heading:
        remove: Are you sure you want to remove this {0}?
      body: This will delete any information you’ve already entered about this {0}.
      footer:
        confirm: Yes, remove this {0}
        cancel: No, keep this {0}
    determiners:
      another: another
      more: more
  modal:
    close: Close this window
    ok: Okay
  boolean:
    'yes': 'Yes'
    'no': 'No'
  date:
    month: Month
    day: Day
    year: Year
    select: '- Select -'
    january: January
    february: February
    march: March
    april: April
    may: May
    june: June
    july: July
    august: August
    september: September
    october: October
    november: November
    december: December
  select:
    select: --Select one --
layout:
  skip-to-main: Skip to main content
  identifier:
    agency-identifier: Agency identifier
    disclaimer: An official website of the <a class="usa-link" target="_blank" href="https://irs.gov">IRS<span class="usa-sr-only"> (opens in a new tab)</span></a>
    about:
      text: About
      link: https://www.irs.gov/about-irs
    accessibility:
      text: Accessibility
      link: https://www.irs.gov/accessibility
    privacy-policy:
      text: Privacy policy
      link: https://www.irs.gov/privacy-disclosure/irs-privacy-policy
    important-links: Important links
  irs:
    name: IRS
    domain: IRS.gov
  banner:
    how-you-know: Here’s how you know
    official-domain: Official websites use .gov
    official-organization: A <strong>.gov</strong> website belongs to an official government organization in the United States.
    secure-https: Secure .gov websites use HTTPS
    disclaimer: An official website of the United States government
    lock-1: A <strong>lock</strong>
    lock-2: or <strong>https://</strong> means you’ve safely connected to the .gov website. Share sensitive information only on official, secure websites.
  noscript: JavaScript is required to use the {0}. Please enable JavaScript or switch to a browser that is JavaScript-capable.
buttons:
  next: Next
  continue: Continue
  back: Back
  submit: Submit
alerts:
  warning:
    complete-required: Please complete the required fields
step-indicator:
  completed: completed
  not-completed: not completed
  step: Step
  of: of
errors:
  CombinedHyphensAndParentheses: Enter only numbers and a decimal.
  InvalidCharacters: Enter only numbers and a decimal.
  InvalidDollar: Enter only numbers and a decimal.
  InvalidHyphens: Enter only numbers and a decimal.
  InvalidParentheses: Enter only numbers and a decimal.
  TooManyDecimals: Enter a number with only one decimal.
  TooManyFractionalDigits: Enter only two digits after the decimal.
  InvalidDay: Enter a valid day.
  InvalidDayDueToLeapYear: Invalid day due to leap year.
  InvalidMonth: Enter a valid month.
  InvalidDate: Enter a valid date.
  InvalidLimit: Invalid limit set.
  IncompleteWritableDate: Enter a complete date or leave blank
  BlankEnum: Value was blank.
  InvalidEnum: Value not found.
  Required: This question is required
  Default: Sorry, something went wrong
  Match: Check the format and try again.
  Max: Enter an amount less than
  Min: Enter an amount more than
audit:
  fact-select:
    question: Fact Path
    blank: -- Select a path --
  collection-id-label: Collection ID
  fact:
    type: 'Fact Type:'
    value: 'Value:'
    remove: Remove fact
    definition: XML Definition
all-screens:
  section:
    page-count: '{0} pages'
    condition-count: '{0} conditions'
  screen:
    condition-count: '{0} conditions'
title:
  format: '{0} - {1} | {2}'
