<!--
  The empty default for the application's own <head> additions.

  Kept as a real (empty) fragment rather than as nothing at all, so fragments/head.html can name it
  unconditionally: an app that has nothing to add has to do nothing, and an app that does add its
  own copy without editing anything the library owns.
-->
<th:block th:fragment="app-head"></th:block>
