<!--
  The shared Taxpert workspace (the `taxpert` package), built in only for an --auditMode build.

  `flags` is set on the page context but not on the all-screens one, so `flags != null` is exactly
  "this is a product page" — the only place the workspace mounts. all-screens is generated with the
  workspace's stylesheet disabled and has no .app-container for its flex layout, so loading these
  modules there would buy nothing and inject unstyled chips into the one page that already draws
  its own.
-->
<th:block th:if="${flags != null and flags.auditMode}">
  <link rel="stylesheet" th:href="|${basePath}/resources/vendor/taxpert/audit-panel/styles/audit-panel.css|" id="audit-panel-styles" disabled />
  <!-- The global nav clones its markup from this file, and it is the first thing on every page, so
       start the fetch alongside the module rather than after it parses. (The audit panel's templates
       need no preload: it is invisible until enableAuditMode(), by which time they have landed.) -->
  <link rel="preload" as="fetch" crossorigin
        th:href="|${basePath}/resources/vendor/taxpert/global-nav/templates/global-nav.html|" />

  <script type="module" th:src="|${basePath}/resources/vendor/taxpert/audit-panel/js/taxpert-audit-panel.js|"></script>
  <script type="module" th:src="|${basePath}/resources/vendor/taxpert/global-nav/js/taxpert-global-nav.js|"></script>
  <!-- The workspace tool panels (the nav's Tools button). Unlike the audit panel's, this stylesheet is
       not behind a toggled `disabled` link: it is scoped entirely to the bundle's own custom elements
       and .ttd-/.ttp-/.ttm- classes, so it restructures nothing in the product page — the same reason
       global-nav.css loads unconditionally through main.css. The dock hides itself unless a tool is
       switched on, and fragments/tool-dock.html keeps it `hidden` while the workspace is off. -->
  <script type="module" th:src="|${basePath}/resources/vendor/taxpert/tool-panels/js/taxpert-tool-dock.js|"></script>
  <!-- Everything the shared workspace knows about this application: the nav taxonomy, the endpoints,
       the feature flags, the outcomes the tracker follows. taxpert ships with none of it, and
       reads the configuration when an element renders rather than when it loads — so this may sit
       before or after the module tags above. See fragments/taxpert-config.html. -->
  <div th:replace="fragments/taxpert-config :: taxpert-config"></div>
</th:block>

<script th:src="|${basePath}/resources/vendor/uswds-3.13.0/js/uswds-init.min.js|"></script>
<script defer th:src="|${basePath}/resources/vendor/uswds-3.13.0/js/uswds.min.js|"></script>

<!--/* Anything else this application wants in <head>: a vendored library, an extra module, a font.
       The library ships an empty default; an app drops its own fragments/app-head.html beside its
       other templates and it wins by app-first resolution.

       A parser-level comment: this is a note to whoever edits the template, and has no business
       being served on all 40-odd pages of every generated site. */-->
<div th:replace="fragments/app-head :: app-head"></div>
