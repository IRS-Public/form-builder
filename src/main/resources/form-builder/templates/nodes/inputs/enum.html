<fieldset class="usa-fieldset" th:attr="aria-describedby=${hintId}">
    <legend class="usa-legend twe-question">
        <div th:utext="#{${contentKey} + .question}" th:remove="tag"></div>
        <span th:if="${!optional}" aria-hidden="true" class="usa-hint" th:text="#{components.fg-set.required}"></span>
    </legend>
    <div th:replace="nodes/hint"></div>
    <div th:replace="nodes/modal-link"></div>
    <div class="usa-radio" th:each="option : ${options}">
        <input th:id="${controlId} + '-' + ${option.value}"
               class="usa-radio__input"
               type="radio"
               th:value="${option.value}"
               th:name="${controlId}"
               th:required="${not optional}"
               aria-invalid="false"
               th:attr="aria-describedby=${option.description != null ? (path + '-' + option.value + '-description') : null}"/>
        <label th:for="${controlId} + '-' + ${option.value}" class="usa-radio__label radio-option">
        <!-- utext, not text: an option's label may carry markup. FgSet.scala stores the option's
             inner XML as the translation value (`option.head.child.mkString`), so `<strong>` and
             `<fg-show path="/taxYear">` both arrive here intact and escaping them would print the
             tags. The boolean input's options have always been rendered this way; this is the same
             rule, applied to the two that were not. -->
            <span th:utext="#{${contentKey} + .options. + ${option.value} + .name}"></span>
            <span th:if="${option.description != null}"
                  class="usa-radio__label-description"
                  th:id="${controlId} + '-' + ${option.value} + '-description'"
                  aria-hidden="true"
                  th:text="#{${contentKey} + .options. + ${option.value} + .description}"></span>
        </label>
    </div>
</fieldset>
