<fg-collection
        th:attr="path=${path}, condition=${condition}, operator=${operator}, itemName=${itemName}, disallowEmpty=${disallowEmpty}, determiner=${determiner}"
        th:data-add-item-if-true="${addItemIfTrue}"
        th:data-seed-item-if-true="${seedItemIfTrue}"
        th:with="
            removeModalId='fg-collection-remove-'+${itemName.replaceAll(' ', '-').trim()}+'-modal',
            itemNameMessage=${#messages.msgOrNull(contentKey + '.itemName')},
            translatedItemName=${itemNameMessage != null ? itemNameMessage : itemName},
            itemNameTitleCase=${translatedItemName.substring(0,1).toUpperCase() + translatedItemName.substring(1)}
        "
>
    <div class="fg-collection__item-container margin-bottom-3">
        <template class="fg-collection__item-template">
            <details class="fg-collection__details">
                <summary class="fg-collection__item-button">
                    <h4>
                        <span th:text="${itemNameTitleCase}"></span>
                        <span class="collection-item-number"></span>
                    </h4>
                </summary>
                <div class="details-content fg-collection__item-content">
                    <div class="fg-collection-item__fields" th:utext="${collectionFacts}"></div>
                    <div class="fg-collection-item__controls" th:if="${!readonly}">
                        <modal-link th:attr="for=${removeModalId}" class="fg-collection-item__remove-item">
                            <svg aria-hidden="true" role="img" focusable="false"
                                class="usa-icon usa-icon--size-3 margin-left-neg-1 margin-y-neg-05">
                                <use th:href="|${basePath}/resources/vendor/uswds-3.13.0/img/sprite.svg#delete|"></use>
                            </svg>
                            <span>
                                <th:block th:text="#{components.fg-collection.buttons.remove(${translatedItemName})}"></th:block>
                                <span class="collection-item-number"></span>
                            </span>
                        </modal-link>
                    </div>
                </div>
            </details>
        </template>
    </div>
    <button type="button" th:if="${!readonly}" class="fg-collection__add-item usa-button usa-button--outline">
        <svg aria-hidden="true" role="img" focusable="false"
            class="usa-icon usa-icon--size-3 margin-left-neg-1 margin-y-neg-05">
            <use th:href="|${basePath}/resources/vendor/uswds-3.13.0/img/sprite.svg#add|"></use>
        </svg>
        <th:block th:if="${determiner == ''}" th:text="#{components.fg-collection.buttons.add(${translatedItemName})}"></th:block>
        <th:block
            th:if="${determiner != ''}"
            th:with="determinerTranslation=#{components.fg-collection.determiners.__${determiner}__}"
        >
            <span class="fg-collection__without-determiner" th:text="#{components.fg-collection.buttons.add(${translatedItemName})}"></span>
            <span class="fg-collection__with-determiner" th:text="#{components.fg-collection.buttons.add-with-determiner(${translatedItemName}, ${determinerTranslation})}"></span>
        </th:block>
    </button>
    <th:block th:if="${!readonly}">
        <div th:replace="~{nodes/modal-dialog :: modal(
                modalId=${removeModalId},
                modalHeading=#{components.fg-collection.remove-item-modal.heading.remove(${translatedItemName})},
                modalContent=#{components.fg-collection.remove-item-modal.body(${translatedItemName})},
                footerContent=~{:: removeItemModalFooter}
        )}">
            <div class="usa-modal__button-group" th:fragment="removeItemModalFooter">
                <button
                        type="button"
                        class="usa-button fg-collection__remove-item-modal__button-confirm"
                        data-close-modal
                        th:text="#{components.fg-collection.remove-item-modal.footer.confirm(${translatedItemName})}">
                    Yes, remove this item
                </button>
                <button
                        type="button"
                        class="usa-button usa-button--outline"
                        data-close-modal
                        th:text="#{components.fg-collection.remove-item-modal.footer.cancel(${translatedItemName})}">
                    No, keep this item
                </button>
            </div>
        </div>
    </th:block>
</fg-collection>
